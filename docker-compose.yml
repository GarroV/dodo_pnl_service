# Локальный запуск всего продукта: база, приложение и рабочий процесс очереди.
#
# Значения берутся из .env (скопировать с .env.example). Портов в этом файле
# нет ни одного зашитого: локально 8000/5440, на площадке 8030/5440 — разница
# только в .env, не в коде (решение D006).
#
# Имени проекта здесь НЕТ намеренно (issue #51). Пока в файле стояло
# `name: dodo-pnl`, все рабочие копии репозитория управляли одними и теми же
# контейнерами и томами: `up` из соседней копии молча менял порты, а
# `down -v` — уносил чужую базу с сидом посреди проверки. Воспроизведено
# дважды на живой стройке.
#
# Теперь имя берётся из `COMPOSE_PROJECT_NAME` (его же требуют теги образов
# ниже — без переменной команда падает, а не захватывает чужой стенд), а если
# в файле окружения его нет, то из имени каталога — у копий они разные.

# Окружение приложения одним куском: веб и рабочий процесс очереди обязаны
# видеть одно и то же. Это не экономия строк, а защита от расхождения: у них
# должна быть одна база, один SECRET_KEY (им подписана полезная нагрузка
# очереди) и одни настройки фонового расчёта. Разъехавшиеся списки переменных
# в этом файле уже дважды стоили дефекта — см. историю DEV_LOGIN ниже.
x-app-env: &app-env
  # Внутри сети compose база — это хост db на своём обычном порту.
  # DATABASE_URL из .env описывает путь с хоста (localhost:POSTGRES_HOST_PORT)
  # и нужен для pytest и manage.py из venv, а не контейнеру.
  #
  # Роль здесь — роль ПРОДУКТА. Схему ею не накатывают: миграции идут отдельной
  # службой `migrate` ролью владельца схемы (T058). Локально обе роли совпадают,
  # на площадке — нет, и в этом весь смысл разделения.
  DATABASE_URL: postgresql://${APP_DB_USER:-${POSTGRES_USER}}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY:?задайте SECRET_KEY в .env}
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  # Вход-заглушка на время стройки. Переменную обязательно передавать в
  # контейнер: без этой строки `DEV_LOGIN=0` в .env не доезжал до приложения,
  # умолчание в настройках включало заглушку обратно, и на площадке любой
  # открывший страницу входил директором. Найдено сверкой 2026-08-07.
  DEV_LOGIN: ${DEV_LOGIN:-1}
  # Пароль учёток сида: его читает и `seed_dev` при создании пользователей, и
  # страница входа для кнопок быстрого входа. Тот же дефект, что был у
  # DEV_LOGIN: без этой строки значение из `.env` не доезжало до контейнера,
  # приложение молча брало умолчание, и сменить пароль на площадке было
  # нечем. Умолчание здесь намеренно не дублируется — если переменной нет ни
  # в `.env`, ни в окружении, compose передаст пустую строку, а приложение
  # возьмёт своё умолчание из `src/web/flags.py`.
  SEED_USER_PASSWORD: ${SEED_USER_PASSWORD-}
  # Фоновый расчёт периода (T024). Выключатель обязан доезжать до контейнера:
  # с PAYRUN_BACKGROUND=0 продукт считает прямо в запросе, и это осознанный
  # режим для площадки без рабочего процесса очереди, а не поломка.
  PAYRUN_BACKGROUND: ${PAYRUN_BACKGROUND:-1}
  PAYRUN_QUEUE_WORKERS: ${PAYRUN_QUEUE_WORKERS:-2}
  PAYRUN_QUEUE_TIMEOUT: ${PAYRUN_QUEUE_TIMEOUT:-600}
  PAYRUN_QUEUE_STALE_SECONDS: ${PAYRUN_QUEUE_STALE_SECONDS:-10}
  # Проверка здоровья читает их из окружения; без передачи молча берёт
  # умолчания, и перенацелить её на площадке было бы нечем.
  #
  # Порта среди них нет и быть не должно (issue #107): проверка ходит ВНУТРЬ
  # контейнера, где приложение слушает 8000 всегда, а `APP_PORT` — порт на
  # хосте. Пока порт был переменной, его правили заодно с `APP_PORT` под второй
  # стенд, и контейнер стоял `unhealthy` при работающем продукте — семь часов,
  # молча. Теперь число живёт в двух местах ниже (команда службы и правая часть
  # проброса) и одной константой в `docker/healthcheck.py`.
  HEALTHCHECK_PATH: ${HEALTHCHECK_PATH:-/}
  HEALTHCHECK_TIMEOUT: ${HEALTHCHECK_TIMEOUT:-5}

services:
  db:
    # Тот же образ, что стоит на площадке: расхождение версий Postgres между
    # разработкой и сервером — источник ошибок, которые видны только на сервере.
    image: pgvector/pgvector:pg17
    labels:
      # По этой метке контейнер находит ночная задача резервного копирования
      # сервера (C:\backups, ретеншн 14 дней). Без метки база не бэкапится.
      backup.pgdump: "true"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:?задайте POSTGRES_DB в .env}
    ports:
      # Наружу — только на localhost. База с персональными данными сотрудников
      # не должна слушать на всех интерфейсах ни локально, ни на сервере.
      - "127.0.0.1:${POSTGRES_HOST_PORT:?задайте POSTGRES_HOST_PORT в .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Не «процесс жив», а «база принимает подключения»: приложение стартует
      # с миграций и падает, если подключиться нельзя.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Схема. Отдельная одноразовая служба, а не команда приложения на старте (T058).
  #
  # Почему так, а не `migrate && runserver` в контейнере приложения, как было
  # раньше. Роль продукта (`app_user` и логин-роль, которой она выдана) намеренно
  # не имеет права на DDL: на этом стоит разграничение доступа, ослаблять её
  # нельзя. Пока приложение ходило в базу владельцем схемы, `migrate` на старте
  # проходил и разницы не было видно; на площадке, где роли разведены, первая же
  # новая миграция уронила бы контейнер приложения, и выглядело бы это как
  # «продукт не стартует» (issue #50, найдено блоком db при T052).
  #
  # Теперь схему накатывает роль, которая на это уполномочена: MIGRATION_DB_USER
  # (владелец схемы). Приложение и рабочий процесс стартуют только после того,
  # как эта служба завершилась успешно — `service_completed_successfully`.
  # Ею же выполняются разовые работы обслуживания, которым нужны права владельца:
  #     docker compose run --rm migrate python manage.py seed_dev
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    # Один образ на все три службы, а не три одинаковых. Иначе частичная
    # пересборка (`docker compose build app`) оставляет схему и продукт на
    # разных сборках кода — молча: контейнеры поднимутся, а миграции будут
    # накатываться старым образом. Поймано фактически при проверке T058.
    # Имя тега включает имя проекта, и переменная ОБЯЗАТЕЛЬНА: параллельные
    # рабочие копии не должны перетирать образы друг другу (issue #51).
    # Умолчание здесь означало бы общий тег на все копии — то есть соседняя
    # копия молча подсовывает свой код при следующем перезапуске службы.
    image: ${COMPOSE_PROJECT_NAME:?задайте COMPOSE_PROJECT_NAME в .env — своё в каждой рабочей копии, иначе стенды склеятся}-app
    depends_on:
      db:
        # Именно service_healthy, а не service_started: контейнер базы отвечает
        # раньше, чем сам Postgres готов, и миграции падали бы на старте.
        condition: service_healthy
    environment:
      <<: *app-env
      # Единственное отличие от окружения продукта — роль подключения. Остальное
      # берётся из общего куска, чтобы списки переменных не разъезжались.
      DATABASE_URL: postgresql://${MIGRATION_DB_USER:-${POSTGRES_USER}}:${MIGRATION_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB}
    command: ["python", "manage.py", "migrate", "--noinput"]
    # Одноразовая работа: перезапускать её нельзя, иначе `docker compose up`
    # никогда не дождётся её завершения.
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Тот же образ, что у службы migrate, — см. комментарий там.
    image: ${COMPOSE_PROJECT_NAME:?задайте COMPOSE_PROJECT_NAME в .env — своё в каждой рабочей копии, иначе стенды склеятся}-app
    depends_on:
      migrate:
        # Не «база жива», а «схема накатана»: без этого приложение поднялось бы
        # на старой схеме и падало бы на отсутствующих колонках.
        condition: service_completed_successfully
    environment: *app-env
    ports:
      # Слева порт на хосте (APP_PORT), справа — всегда 8000 внутри контейнера.
      - "${APP_PORT:?задайте APP_PORT в .env}:8000"
    # Только сервер. Миграции отсюда убраны сознательно — см. службу `migrate`
    # выше: роль продукта права на DDL не имеет и иметь не должна. Забыть о
    # схеме при этом невозможно: приложение не стартует, пока `migrate` не
    # завершится успешно.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    healthcheck:
      # Проверка ходит и в веб, и в базу — см. docker/healthcheck.py, там
      # объяснено, почему проверки только порта недостаточно.
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Рабочий процесс очереди: он и считает периоды фоном (T024). Отдельный
  # контейнер, а не поток внутри веба, — иначе расчёт жил и умирал бы вместе с
  # запросом, ради чего очередь и заводилась.
  #
  # Если контейнера нет, продукт **не перестаёт считать**: страница периода
  # видит, что задачу никто не взял, говорит об этом словами и предлагает
  # посчитать прямо сейчас. Молчаливой подмены нет ни в одну сторону.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # Тот же образ, что у службы migrate, — см. комментарий там.
    image: ${COMPOSE_PROJECT_NAME:?задайте COMPOSE_PROJECT_NAME в .env — своё в каждой рабочей копии, иначе стенды склеятся}-app
    depends_on:
      # Схему накатывает служба `migrate`, а не веб (T058). Рабочий процесс,
      # запущенный раньше неё, падал бы на отсутствующих таблицах очереди и
      # перезапускался, пока не повезёт, — поэтому ждём именно её завершения,
      # а не живости приложения.
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      # Единственное отличие от окружения продукта — роль подключения, и она
      # третья (T124, issue #66). Рабочий процесс читает очередь соединением
      # напрямую, без `set local role`, а роль продукта на очереди умеет ровно
      # одно — поставить задачу (`0047_queue_privileges`): полезная нагрузка ей
      # не нужна. Одной ролью на обе службы это не сходится — очередь падала бы
      # `permission denied for table django_q_ormq`.
      #
      # Логин-роль очереди на площадке состоит в двух ролях: `queue_worker`
      # (разбирать очередь) и `app_user` (работать с данными внутри задачи —
      # `db_context` делает `set local role app_user`). Роль веба членом
      # `queue_worker` не делается: иначе защита полезной нагрузки держалась бы
      # на дисциплине кода, а не на правах базы.
      #
      # Пусто — берётся роль продукта, а если пусто и там, то владелец схемы:
      # локально все три роли совпадают, и заводить вторую и третью ради
      # разработки незачем.
      DATABASE_URL: postgresql://${QUEUE_DB_USER:-${APP_DB_USER:-${POSTGRES_USER}}}:${QUEUE_DB_PASSWORD:-${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}}@db:5432/${POSTGRES_DB}
    command: ["python", "manage.py", "qcluster"]
    healthcheck:
      # Живость проверяется по самой очереди, а не по процессу: процесс бывает
      # жив и при этом не забирает задачи — см. docker/queue_healthcheck.py.
      test: ["CMD", "python", "docker/queue_healthcheck.py"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # --- Демо-стенд (T033, T034) ------------------------------------------------
  #
  # Живёт в профиле `demo` и в обычный `docker compose up` не входит:
  #
  #     docker compose --profile demo up -d
  #
  # Отдельный экземпляр приложения на отдельной базе, а не режим продукта. База
  # своя не ради чистоты, а потому что демо **сбрасывается пересозданием базы
  # целиком** (D016): рядом лежат ФИО и суммы живых людей, и операция такого
  # рода не должна иметь ни одного способа их задеть.
  #
  # Три службы, и разделены они по времени жизни, а не по вкусу:
  #   demo-init   один раз собирает эталон и восстанавливает из него демо;
  #   demo        сам стенд, поднимается после того, как база готова;
  #   demo-reset  служба расписания: возвращает демо к эталону раз в N минут.

  # Окружение демо одним куском — по той же причине, что и у продукта: службы
  # обязаны видеть одно и то же. Разъехавшиеся списки переменных в этом файле
  # уже дважды стоили дефекта.
  demo-init: &demo-init
    build:
      context: .
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:?задайте COMPOSE_PROJECT_NAME в .env — своё в каждой рабочей копии, иначе стенды склеятся}-app
    profiles: ["demo"]
    depends_on:
      db:
        condition: service_healthy
    environment: &demo-owner-env
      # Роль владельца схемы: эта служба создаёт и удаляет базы и накатывает
      # миграции. Роль продукта на это не уполномочена и уполномочена быть не
      # должна — на разделении ролей стоит разграничение доступа (T058).
      DATABASE_URL: postgresql://${MIGRATION_DB_USER:-${POSTGRES_USER}}:${MIGRATION_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DEMO_DB:-dodo_pnl_demo}
      # Адрес демо-базы внутри сети compose. Он же сверяется предохранителем:
      # команда демо не выполняется, если подключена не сюда (см. demo/guard.py).
      DEMO_DATABASE_URL: postgresql://${MIGRATION_DB_USER:-${POSTGRES_USER}}:${MIGRATION_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DEMO_DB:-dodo_pnl_demo}
      SECRET_KEY: ${SECRET_KEY:?задайте SECRET_KEY в .env}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Демо всегда англоязычное, независимо от языка продукта. Не настройка
      # вкуса: демо показывают заказчику и кладут в портфолио.
      UI_LANGUAGE: en
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD-}
      # Расчёт трёх месяцев идёт прямо в команде наполнения; рабочий процесс
      # очереди демо-стенду не нужен, и обещать фоновый расчёт ему нечем.
      PAYRUN_BACKGROUND: "0"
    # Собрать эталон заново и восстановить из него демо. Именно `--rebuild-template`:
    # образ мог собраться с новым кодом и новыми миграциями, и эталон, оставшийся
    # от прошлой версии, показывал бы вчерашний продукт.
    command: ["python", "manage.py", "demo_reset", "--rebuild-template"]
    restart: "no"

  demo:
    <<: *demo-init
    profiles: ["demo"]
    depends_on:
      demo-init:
        # Не «база жива», а «демо наполнено»: стенд, поднятый на пустой базе,
        # встретил бы посетителя пустыми экранами.
        condition: service_completed_successfully
    environment:
      <<: *demo-owner-env
      # Единственное отличие от служб обслуживания — роль подключения: сам стенд
      # ходит в базу ролью продукта, как и продукт. Иначе демо показывало бы
      # разграничение доступа, которого у партнёра не будет.
      DATABASE_URL: postgresql://${APP_DB_USER:-${POSTGRES_USER}}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DEMO_DB:-dodo_pnl_demo}
      DEMO_DATABASE_URL: postgresql://${APP_DB_USER:-${POSTGRES_USER}}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DEMO_DB:-dodo_pnl_demo}
      # Вход без регистрации живёт только здесь. У продукта этой переменной нет,
      # и тогда маршрутов /demo/* не существует вовсе.
      DEMO_MODE: "1"
      DEMO_KEY: ${DEMO_KEY-}
      # Кнопки быстрого входа учётками сида демо-стенду не нужны: у него своя
      # точка входа, и вторая была бы вторым способом попасть внутрь.
      DEV_LOGIN: "0"
      HEALTHCHECK_PATH: ${HEALTHCHECK_PATH:-/}
      HEALTHCHECK_TIMEOUT: ${HEALTHCHECK_TIMEOUT:-5}
    ports:
      - "${DEMO_APP_PORT:-8010}:8000"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  demo-reset:
    <<: *demo-init
    profiles: ["demo"]
    depends_on:
      demo-init:
        condition: service_completed_successfully
    # Сброс по расписанию, а не кнопкой в интерфейсе. Кнопка означает, что демо
    # чинит человек, — то есть до первого дня, когда на него никто не смотрит.
    command:
      - "python"
      - "manage.py"
      - "demo_reset"
      - "--every"
      - "${DEMO_RESET_MINUTES:-60}"
    restart: unless-stopped

volumes:
  pgdata:
