# Локальный запуск всего продукта: база, приложение и рабочий процесс очереди.
#
# Значения берутся из .env (скопировать с .env.example). Портов в этом файле
# нет ни одного зашитого: локально 8000/5440, на площадке 8030/5440 — разница
# только в .env, не в коде (решение D006).
#
# Имя проекта задано явно: на площадке рядом живут чужие стеки, и наши
# контейнеры не должны склеиться с ними по именам.
name: dodo-pnl

# Окружение приложения одним куском: веб и рабочий процесс очереди обязаны
# видеть одно и то же. Это не экономия строк, а защита от расхождения: у них
# должна быть одна база, один SECRET_KEY (им подписана полезная нагрузка
# очереди) и одни настройки фонового расчёта. Разъехавшиеся списки переменных
# в этом файле уже дважды стоили дефекта — см. историю DEV_LOGIN ниже.
x-app-env: &app-env
  # Внутри сети compose база — это хост db на своём обычном порту.
  # DATABASE_URL из .env описывает путь с хоста (localhost:POSTGRES_HOST_PORT)
  # и нужен для pytest и manage.py из venv, а не контейнеру.
  #
  # Роль здесь — роль ПРОДУКТА. Схему ею не накатывают: миграции идут отдельной
  # службой `migrate` ролью владельца схемы (T058). Локально обе роли совпадают,
  # на площадке — нет, и в этом весь смысл разделения.
  DATABASE_URL: postgresql://${APP_DB_USER:-${POSTGRES_USER}}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY:?задайте SECRET_KEY в .env}
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  # Вход-заглушка на время стройки. Переменную обязательно передавать в
  # контейнер: без этой строки `DEV_LOGIN=0` в .env не доезжал до приложения,
  # умолчание в настройках включало заглушку обратно, и на площадке любой
  # открывший страницу входил директором. Найдено сверкой 2026-08-07.
  DEV_LOGIN: ${DEV_LOGIN:-1}
  # Пароль учёток сида: его читает и `seed_dev` при создании пользователей, и
  # страница входа для кнопок быстрого входа. Тот же дефект, что был у
  # DEV_LOGIN: без этой строки значение из `.env` не доезжало до контейнера,
  # приложение молча брало умолчание, и сменить пароль на площадке было
  # нечем. Умолчание здесь намеренно не дублируется — если переменной нет ни
  # в `.env`, ни в окружении, compose передаст пустую строку, а приложение
  # возьмёт своё умолчание из `src/web/flags.py`.
  SEED_USER_PASSWORD: ${SEED_USER_PASSWORD-}
  # Фоновый расчёт периода (T024). Выключатель обязан доезжать до контейнера:
  # с PAYRUN_BACKGROUND=0 продукт считает прямо в запросе, и это осознанный
  # режим для площадки без рабочего процесса очереди, а не поломка.
  PAYRUN_BACKGROUND: ${PAYRUN_BACKGROUND:-1}
  PAYRUN_QUEUE_WORKERS: ${PAYRUN_QUEUE_WORKERS:-2}
  PAYRUN_QUEUE_TIMEOUT: ${PAYRUN_QUEUE_TIMEOUT:-600}
  PAYRUN_QUEUE_STALE_SECONDS: ${PAYRUN_QUEUE_STALE_SECONDS:-10}
  # Проверка здоровья читает их из окружения; без передачи молча берёт
  # умолчания, и перенацелить её на площадке было бы нечем.
  HEALTHCHECK_PORT: ${HEALTHCHECK_PORT:-8000}
  HEALTHCHECK_PATH: ${HEALTHCHECK_PATH:-/}
  HEALTHCHECK_TIMEOUT: ${HEALTHCHECK_TIMEOUT:-5}

services:
  db:
    # Тот же образ, что стоит на площадке: расхождение версий Postgres между
    # разработкой и сервером — источник ошибок, которые видны только на сервере.
    image: pgvector/pgvector:pg17
    labels:
      # По этой метке контейнер находит ночная задача резервного копирования
      # сервера (C:\backups, ретеншн 14 дней). Без метки база не бэкапится.
      backup.pgdump: "true"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:?задайте POSTGRES_DB в .env}
    ports:
      # Наружу — только на localhost. База с персональными данными сотрудников
      # не должна слушать на всех интерфейсах ни локально, ни на сервере.
      - "127.0.0.1:${POSTGRES_HOST_PORT:?задайте POSTGRES_HOST_PORT в .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Не «процесс жив», а «база принимает подключения»: приложение стартует
      # с миграций и падает, если подключиться нельзя.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Схема. Отдельная одноразовая служба, а не команда приложения на старте (T058).
  #
  # Почему так, а не `migrate && runserver` в контейнере приложения, как было
  # раньше. Роль продукта (`app_user` и логин-роль, которой она выдана) намеренно
  # не имеет права на DDL: на этом стоит разграничение доступа, ослаблять её
  # нельзя. Пока приложение ходило в базу владельцем схемы, `migrate` на старте
  # проходил и разницы не было видно; на площадке, где роли разведены, первая же
  # новая миграция уронила бы контейнер приложения, и выглядело бы это как
  # «продукт не стартует» (issue #50, найдено блоком db при T052).
  #
  # Теперь схему накатывает роль, которая на это уполномочена: MIGRATION_DB_USER
  # (владелец схемы). Приложение и рабочий процесс стартуют только после того,
  # как эта служба завершилась успешно — `service_completed_successfully`.
  # Ею же выполняются разовые работы обслуживания, которым нужны права владельца:
  #     docker compose run --rm migrate python manage.py seed_dev
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    # Один образ на все три службы, а не три одинаковых. Иначе частичная
    # пересборка (`docker compose build app`) оставляет схему и продукт на
    # разных сборках кода — молча: контейнеры поднимутся, а миграции будут
    # накатываться старым образом. Поймано фактически при проверке T058.
    # Имя тега включает имя проекта: параллельные рабочие копии не должны
    # перетирать образы друг другу (issue #51).
    image: ${COMPOSE_PROJECT_NAME:-dodo-pnl}-app
    depends_on:
      db:
        # Именно service_healthy, а не service_started: контейнер базы отвечает
        # раньше, чем сам Postgres готов, и миграции падали бы на старте.
        condition: service_healthy
    environment:
      <<: *app-env
      # Единственное отличие от окружения продукта — роль подключения. Остальное
      # берётся из общего куска, чтобы списки переменных не разъезжались.
      DATABASE_URL: postgresql://${MIGRATION_DB_USER:-${POSTGRES_USER}}:${MIGRATION_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB}
    command: ["python", "manage.py", "migrate", "--noinput"]
    # Одноразовая работа: перезапускать её нельзя, иначе `docker compose up`
    # никогда не дождётся её завершения.
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Тот же образ, что у службы migrate, — см. комментарий там.
    image: ${COMPOSE_PROJECT_NAME:-dodo-pnl}-app
    depends_on:
      migrate:
        # Не «база жива», а «схема накатана»: без этого приложение поднялось бы
        # на старой схеме и падало бы на отсутствующих колонках.
        condition: service_completed_successfully
    environment: *app-env
    ports:
      # Слева порт на хосте (APP_PORT), справа — всегда 8000 внутри контейнера.
      - "${APP_PORT:?задайте APP_PORT в .env}:8000"
    # Только сервер. Миграции отсюда убраны сознательно — см. службу `migrate`
    # выше: роль продукта права на DDL не имеет и иметь не должна. Забыть о
    # схеме при этом невозможно: приложение не стартует, пока `migrate` не
    # завершится успешно.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    healthcheck:
      # Проверка ходит и в веб, и в базу — см. docker/healthcheck.py, там
      # объяснено, почему проверки только порта недостаточно.
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Рабочий процесс очереди: он и считает периоды фоном (T024). Отдельный
  # контейнер, а не поток внутри веба, — иначе расчёт жил и умирал бы вместе с
  # запросом, ради чего очередь и заводилась.
  #
  # Если контейнера нет, продукт **не перестаёт считать**: страница периода
  # видит, что задачу никто не взял, говорит об этом словами и предлагает
  # посчитать прямо сейчас. Молчаливой подмены нет ни в одну сторону.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # Тот же образ, что у службы migrate, — см. комментарий там.
    image: ${COMPOSE_PROJECT_NAME:-dodo-pnl}-app
    depends_on:
      # Схему накатывает служба `migrate`, а не веб (T058). Рабочий процесс,
      # запущенный раньше неё, падал бы на отсутствующих таблицах очереди и
      # перезапускался, пока не повезёт, — поэтому ждём именно её завершения,
      # а не живости приложения.
      migrate:
        condition: service_completed_successfully
    environment: *app-env
    command: ["python", "manage.py", "qcluster"]
    healthcheck:
      # Живость проверяется по самой очереди, а не по процессу: процесс бывает
      # жив и при этом не забирает задачи — см. docker/queue_healthcheck.py.
      test: ["CMD", "python", "docker/queue_healthcheck.py"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
