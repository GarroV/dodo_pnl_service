[project]
name = "dodo-pnl-service"
version = "0.1.0"
description = "Сбор первичных данных и сборка P&L для партнёров Dodo"
# 3.11 и 3.12 уже security-only; Django 6.1 требует 3.12+ (решения D010, D018).
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "django>=6.1,<6.2",
    # Приложение и тесты схемы ходят в Postgres одним драйвером: расхождений
    # между тем, что видит ORM, и тем, что видит тест, быть не должно.
    "psycopg[binary]>=3.1",
    # Очередь фоновых задач на самом Postgres (решение из docs/forge/plan.md):
    # задач единицы в день, транзакционность достаётся даром, а лишний брокер на
    # домашнем сервере — лишний контур обновлений. Поддержка Django 6 появилась
    # в 1.9.0, поэтому нижняя граница не ниже 1.10.
    "django-q2>=1.10,<2",
    # Статику отдаёт само приложение: на площадке DJANGO_DEBUG=0, а runserver
    # при нём статику не отдаёт вовсе — экран табеля оставался без htmx и
    # стилей, и ломалось это молча (issue #68).
    "whitenoise>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `.` рядом с `src` обязателен, и это не украшение: `tests/test_error_pages.py`
# подменяет ROOT_URLCONF на `tests.boom_urls`, то есть импортирует пакет `tests`
# по имени. Корень репозитория попадает в пути сам только при запуске
# `python -m pytest` (так делает CLAUDE.md), а при голом `pytest` (так делает CI
# и README) — нет, и три проверки страницы отказа падали ТОЛЬКО в CI.
pythonpath = ["src", "."]
# Без `-q` намеренно (issue #93). Флаг здесь складывается с флагом из командной
# строки: у человека, привыкшего писать `pytest -q`, получается `-qq`, а на этом
# уровне pytest перестаёт печатать итоговую строку «N passed» вовсе. Прогон
# выглядит законченным и молчит о результате — худший вид тишины в проверках.
addopts = ""

[tool.ruff]
line-length = 100
target-version = "py313"
# Пакеты живут в src/, тесты импортируют друг друга по имени модуля —
# без этого ruff считает свой же код чужим и переставляет импорты.
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Миграции — снимок схемы на момент времени, длинные литералы SQL в них норма.
"src/core/migrations/*.py" = ["E501"]

[tool.coverage.run]
source = ["src"]
# manage.py гоняется подпроцессом, иначе тест проверял бы не то, что запускает
# человек. parallel + хук из tests/_coverage_subprocess собирают и его данные.
parallel = true
omit = ["*/asgi.py", "*/wsgi.py"]
