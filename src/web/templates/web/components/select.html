{% comment %}
Выбор из справочника: подпись и список одной парой.

Отдельный компонент, а не `<select>` руками на каждом экране, ровно по той же
причине, что и `field.html`: подпись обязана быть связана с полем через `id`,
иначе поле недоступно с клавиатуры и экранному диктору. Разница только в том,
что значение выбирается, а не набирается.

Пустой вариант («не задано») показывается только у необязательного поля и
подписывается словами, а не пустой строкой: пустая строка в списке выглядит как
промах вёрстки, и человек не понимает, выберет он этим что-то или ничего.

Варианты приходят готовым списком из представления — `{code, title, selected}`.
Названия в нём почти всегда данные партнёра (точки, группы, юрлица), и
переводить их продукт не вправе; те, что не данные (регистр учёта), приходят
уже отобранными для роли (D023) — компонент в справочники не ходит.

Параметры:
  id, name              обязательные;
  label                 подпись; пусто — подписи нет;
  options               список вариантов;
  required              обязательность на стороне браузера — до серверной, а не вместо;
  empty_label           подпись пустого варианта; пусто — варианта нет;
  empty_selected        выбран пустой вариант (ни один из списка не отмечен);
  help                  пояснение под полем.
{% endcomment %}{% if label %}<label for="{{ id }}">{{ label }}</label>
{% endif %}<select id="{{ id }}" name="{{ name }}"{% if help %} aria-describedby="{{ id }}_help"{% endif %}{% if required %} required{% endif %}>
  {% if empty_label %}<option value=""{% if empty_selected %} selected{% endif %}>{{ empty_label }}</option>{% endif %}
  {% for option in options %}<option value="{{ option.code }}"{% if option.selected %} selected{% endif %}>{{ option.title }}</option>
  {% endfor %}
</select>
{% if help %}<span class="note" id="{{ id }}_help">{{ help }}</span>{% endif %}
